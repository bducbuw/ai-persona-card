<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>AI气质人设卡 · 测测你是哪种气质</title>
<meta name="description" content="上传一张照片，AI为你生成专属气质人设卡">
<style>
:root{
  --bg1:#FFF6EC;--bg2:#FDE7E4;--ink:#3B2F2F;--muted:#8A7B76;
  --accent:#E8846B;--accent2:#F3B48B;--card:#FFFFFF;--line:#F1E3DA;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink);background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%);background-attachment:fixed;
  display:flex;justify-content:center}
.app{width:100%;max-width:440px;min-height:100vh;padding:28px 20px 40px;position:relative}
.screen{display:none;animation:fade .45s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* landing */
.brand{font-size:13px;letter-spacing:4px;color:var(--accent);font-weight:600;text-align:center;margin-top:18px}
h1{font-size:34px;text-align:center;margin:10px 0 8px;letter-spacing:2px}
h1 span{background:linear-gradient(90deg,var(--accent),#C77DB5);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:var(--muted);font-size:14px;line-height:1.7}
.sample{margin:26px auto 22px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.chip{font-size:12px;padding:6px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--ink)}
.upload{display:block;position:relative;overflow:hidden;margin:0 auto;width:100%;border:2px dashed #EBC7B6;border-radius:24px;background:rgba(255,255,255,.7);
  padding:34px 16px;text-align:center;cursor:pointer;transition:.2s}
.upload:active{transform:scale(.98)}
.upload .icon{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;background:linear-gradient(135deg,var(--accent2),var(--accent));
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px;line-height:1}
.upload b{font-size:17px;display:block;margin-bottom:6px}
.upload small{color:var(--muted);font-size:12px}
#preview{display:none;width:150px;height:150px;object-fit:cover;border-radius:50%;margin:0 auto 12px;border:4px solid #fff;box-shadow:0 6px 20px rgba(200,120,100,.25)}
.field{margin:18px 0 0}
.field input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:15px;outline:none;color:var(--ink)}
.btn{display:block;width:100%;border:none;border-radius:999px;padding:15px;font-size:16px;font-weight:600;cursor:pointer;margin-top:16px;transition:.2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(90deg,var(--accent),#D9789C);color:#fff;box-shadow:0 8px 22px rgba(232,132,107,.35)}
.btn.primary:disabled{opacity:.45;box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.note{text-align:center;font-size:11px;color:var(--muted);margin-top:14px;line-height:1.6}
.count{text-align:center;font-size:12px;color:var(--muted);margin-top:22px}
.count b{color:var(--accent)}

/* analyzing */
.scan{position:relative;width:240px;height:240px;margin:70px auto 30px;border-radius:28px;overflow:hidden;box-shadow:0 12px 30px rgba(200,120,100,.25)}
.scan img{width:100%;height:100%;object-fit:cover;filter:saturate(.9)}
.scan:after{content:"";position:absolute;left:0;right:0;height:60px;top:-60px;
  background:linear-gradient(180deg,transparent,rgba(255,200,170,.75),transparent);animation:sweep 1.6s linear infinite}
.scan .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.25) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.25) 1px,transparent 1px);background-size:24px 24px}
@keyframes sweep{to{top:240px}}
.status{text-align:center;font-size:16px;font-weight:600;min-height:24px}
.bar{height:6px;background:#fff;border-radius:6px;margin:18px 30px 0;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .4s}

/* result */
.card{background:var(--card);border-radius:28px;overflow:hidden;box-shadow:0 14px 40px rgba(180,110,90,.18)}
.hero{position:relative;padding:26px 22px 20px;color:#fff;text-align:center}
.hero .photo{width:118px;height:118px;border-radius:50%;object-fit:cover;border:4px solid rgba(255,255,255,.85);box-shadow:0 8px 20px rgba(0,0,0,.12)}
.hero .who{font-size:12px;opacity:.9;margin-top:10px;letter-spacing:1px}
.hero .series{display:inline-block;margin-top:12px;font-size:12px;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.25)}
.hero .name{font-size:28px;font-weight:800;margin-top:8px;letter-spacing:2px;text-shadow:0 2px 8px rgba(0,0,0,.08)}
.body{padding:20px 22px 24px}
.tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.tags span{font-size:13px;padding:5px 12px;border-radius:999px;font-weight:600}
.quote{font-size:14px;line-height:1.9;color:#5A4A46;background:#FFF8F2;border-radius:16px;padding:14px 16px}
.score{display:flex;align-items:center;justify-content:space-between;margin:18px 0 6px}
.score .num{font-size:44px;font-weight:800;line-height:1}
.score .num small{font-size:14px;font-weight:600;margin-left:2px}
.score .txt{text-align:right;font-size:12px;color:var(--muted);line-height:1.6}
.score .txt b{font-size:15px}
canvas#radar{display:block;margin:6px auto 0;width:260px;height:230px}
.sec{font-size:13px;font-weight:700;margin:18px 0 10px;display:flex;align-items:center;gap:6px}
.sec:before{content:"";width:4px;height:14px;border-radius:2px;background:var(--accent)}
.tips{display:grid;gap:10px}
.tip{display:flex;gap:10px;font-size:13px;line-height:1.6;color:#5A4A46}
.tip em{font-style:normal;flex:none;font-weight:700;width:44px;color:var(--ink)}
.match{font-size:13px;color:#5A4A46;line-height:1.7}
.actions{margin-top:18px}
.row{display:flex;gap:10px}
.row .btn{margin-top:10px}

.file-cover{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:200px;z-index:2}
/* report */
.report{margin-bottom:4px}
.rep-head{display:flex;gap:16px;align-items:center;padding:22px 22px 6px}
.rep-photo{width:96px;height:96px;border-radius:22px;object-fit:cover;flex:none;box-shadow:0 6px 16px rgba(180,110,90,.2)}
.rep-title{font-size:15px;font-weight:700}
.rep-score{margin-top:4px;display:flex;align-items:baseline;gap:8px}
.rep-score b{font-size:40px;line-height:1.1;background:linear-gradient(90deg,var(--accent),#D9789C);-webkit-background-clip:text;background-clip:text;color:transparent}
.rep-score small{font-size:12px;color:var(--muted)}
.rep-best{font-size:12px;color:var(--accent);font-weight:600;margin-top:2px}
.ratio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ratio div{background:#FFF8F2;border-radius:14px;padding:10px 6px;text-align:center}
.ratio b{display:block;font-size:15px;margin:2px 0}
.ratio span{font-size:11px;color:var(--muted)}
.ratio i{font-style:normal;font-size:11px;color:var(--accent)}
.aspects{display:grid;gap:10px}
.asp{border:1px solid var(--line);border-radius:16px;padding:12px 14px;opacity:0;transform:translateY(6px);transition:.4s}
.asp.in{opacity:1;transform:none}
.asp-top{display:flex;align-items:center;gap:8px}
.asp-top .ic{font-size:18px}
.asp-top .nm{font-size:14px;font-weight:700}
.asp-top .lb{font-size:12px;color:var(--accent);margin-left:auto;font-weight:600}
.asp-bar{display:flex;align-items:center;gap:8px;margin:8px 0 6px}
.asp-bar .tr{flex:1;height:6px;background:#F6EAE3;border-radius:6px;overflow:hidden}
.asp-bar .tr i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width 1s ease}
.asp-bar b{font-size:13px;width:28px;text-align:right}
.asp p{font-size:13px;line-height:1.7;color:#5A4A46}
.asp.best{border-color:var(--accent);background:#FFF8F4}
.asp.best .nm:after{content:"最出彩";font-size:10px;color:#fff;background:var(--accent);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.divider{text-align:center;font-size:13px;color:var(--muted);margin:26px 0 14px}
#reveal{margin:18px 0 6px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(40,25,20,.72);display:none;align-items:center;justify-content:center;flex-direction:column;padding:24px;z-index:9}
.modal.on{display:flex}
.modal img{max-width:100%;max-height:72vh;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.modal p{color:#fff;font-size:14px;margin:14px 0 4px}
.modal .row{width:100%;max-width:340px}
.toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);background:rgba(50,35,30,.9);color:#fff;font-size:13px;padding:10px 18px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;z-index:10}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="app">

  <!-- 1. 首页 -->
  <section class="screen on" id="s-home">
    <div class="brand">AI · PERSONA CARD</div>
    <h1>测测你的<span>气质人设</span></h1>
    <p class="sub">上传一张清晰正脸照<br>AI读懂你的眉眼与气场，生成专属人设卡</p>
    <div class="sample">
      <span class="chip">🌙 清冷系·月光学姐</span>
      <span class="chip">☕ 温柔系·午后拿铁</span>
      <span class="chip">🎞️ 故事感·雨天胶片女主</span>
    </div>
    <label class="upload" id="upBox">
      <img id="preview" alt="">
      <div class="icon" id="plus">+</div>
      <b id="upTitle">上传照片</b>
      <small id="upHint">支持相册或拍照，建议光线充足、五官清晰</small>
      <input type="file" id="file" accept="image/*" class="file-cover">
    </label>
    <div class="field"><input id="nick" maxlength="10" placeholder="你的昵称（选填，会印在卡片上）"></div>
    <button class="btn primary" id="go" disabled>生成我的人设卡</button>
    <p class="note">照片仅用于本次分析，不会被保存<br>结果仅供娱乐，你本来就很好看 ✨</p>
  </section>

  <!-- 2. 分析中 -->
  <section class="screen" id="s-load">
    <div class="scan"><img id="scanImg" alt=""><div class="grid"></div></div>
    <p class="status" id="status">正在读取眉眼弧度…</p>
    <div class="bar"><i id="prog"></i></div>
  </section>

  <!-- 3. 结果 -->
  <section class="screen" id="s-result">
    <!-- 3a. 颜值分析报告 -->
    <div class="card report">
      <div class="rep-head">
        <img class="rep-photo" id="aPhoto" alt="">
        <div class="rep-meta">
          <div class="rep-title" id="aWho"></div>
          <div class="rep-score"><b id="aScore"></b><small>颜值综合分</small></div>
          <div class="rep-best" id="aBest"></div>
        </div>
      </div>
      <div class="body">
        <div class="sec">面部比例</div>
        <div class="ratio" id="aRatio"></div>
        <div class="sec">六维五官解析</div>
        <div class="aspects" id="aAspects"></div>
        <div class="sec">AI 总评</div>
        <div class="quote" id="aSum"></div>
      </div>
    </div>
    <button class="btn primary" id="reveal">揭晓我的气质人设 ✨</button>

    <!-- 3b. 气质结论 -->
    <div id="personaWrap" style="display:none">
    <div class="divider">— 综合以上分析，你的气质人设是 —</div>
    <div class="card" id="card">
      <div class="hero" id="hero">
        <img class="photo" id="rPhoto" alt="">
        <div class="who" id="rWho"></div>
        <div class="series" id="rSeries"></div>
        <div class="name" id="rName"></div>
      </div>
      <div class="body">
        <div class="tags" id="rTags"></div>
        <div class="quote" id="rQuote"></div>
        <div class="score">
          <div class="num" id="rScore"></div>
          <div class="txt">人设稀有度<br>气质匹配度 <b id="rBeat"></b></div>
        </div>
        <canvas id="radar" width="520" height="460"></canvas>
        <div class="sec">专属变美指南</div>
        <div class="tips" id="rTips"></div>
        <div class="sec">最佳气质搭子</div>
        <div class="match" id="rMatch"></div>
      </div>
    </div>
    <div class="actions">
      <button class="btn primary" id="save">保存分享图</button>
      <div class="row">
        <button class="btn ghost" id="again">再测一次</button>
        <button class="btn ghost" id="invite">邀请好友来测</button>
      </div>
    </div>
    </div>
  </section>
</div>

<div class="modal" id="modal">
  <img id="shareImg" alt="分享图">
  <p>长按图片保存，或点击下方下载</p>
  <div class="row">
    <a class="btn primary" id="dl" download="我的气质人设卡.png" style="text-align:center;text-decoration:none">下载图片</a>
    <button class="btn ghost" id="close">关闭</button>
  </div>
</div>
<div class="toast" id="toast"></div>

/* ================= 工具 ================= */
const $=id=>document.getElementById(id);
let photoURL="", result=null;
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1800)}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));$(id).classList.add("on");scrollTo(0,0)}
function rng(seed){return()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}}

/* 压缩图片到 768px 内，方便本地处理和上传 */
function loadImage(file){
  return new Promise((ok,bad)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      try{
        const m=768,s=Math.min(1,m/Math.max(img.width,img.height));
        const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);ok(c.toDataURL("image/jpeg",.88));
      }catch(e){bad(e)}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);bad(new Error("decode"))};
    img.src=url;
  });
}

/* ================= 本地示例分析（未接模型时使用） ================= */
function mockAnalyze(dataURL){
  return new Promise(ok=>{
    const img=new Image();img.onload=()=>{
      const c=document.createElement("canvas");c.width=c.height=32;const x=c.getContext("2d");
      x.drawImage(img,0,0,32,32);const d=x.getImageData(0,0,32,32).data;
      let h=2166136261,br=0,warm=0;
      for(let i=0;i<d.length;i+=4){h=Math.imul(h^(d[i]+d[i+1]*3+d[i+2]*7),16777619)>>>0;br+=d[i]+d[i+1]+d[i+2];warm+=d[i]-d[i+2]}
      br/=d.length/4*3;warm/=d.length/4;
      const R=rng(h);
      // 亮度/冷暖影响倾向，让结果“看起来有依据”
      let pool=PERSONAS.map((p,i)=>({i,w:1+(warm>15?(p.base[0]>80?1.5:0):(p.base[1]>70?1.5:0))+(br>150?(p.base[2]>70?1:0):(p.base[4]>80?1:0))+R()*2}));
      pool.sort((a,b)=>b.w-a.w);
      const p=PERSONAS[pool[0].i];
      const dims=p.base.map(v=>Math.max(25,Math.min(99,Math.round(v+(R()-.5)*14))));
      const score=86+Math.floor(R()*12);
      const rarity=score>=94?"SSR":score>=90?"SR":"R+";
      // 六维五官
      const aspects=ASPECTS.map(a=>{const pick=a.v[Math.floor(R()*a.v.length)];return {name:a.k,icon:a.ic,label:pick[0],text:pick[1],score:85+Math.floor(R()*13)}});
      const bi=aspects.reduce((m,a,i)=>a.score>aspects[m].score?i:m,0);aspects[bi].score=Math.max(aspects[bi].score,95);
      const beauty=Math.round(aspects.reduce((s,a)=>s+a.score,0)/aspects.length*10)/10;
      const t=[1,1,1].map(()=>(0.95+R()*0.1).toFixed(2));
      const ratio=[
        {k:"三庭比例",v:t.join(" : "),n:"接近 1:1:1 标准比例"},
        {k:"五眼比例",v:(0.96+R()*0.08).toFixed(2),n:"眼距舒适协调"},
        {k:"面部对称",v:(91+Math.floor(R()*8))+"%",n:"左右均衡"}];
      const summary=SUMS[Math.floor(R()*SUMS.length)].replace("{best}",aspects[bi].name);
      ok({beauty,best:aspects[bi].name,ratio,aspects,summary,
          series:p.series,name:p.name,emoji:p.emoji,colors:p.c,tags:p.tags,quote:p.quote,dims,rarity,match_rate:score+"%",
          tips:{"妆容":p.makeup,"穿搭":p.outfit,"拍照":p.photo},match:p.match});
    };img.src=dataURL;
  });
}

async function analyze(dataURL){
  if(CONFIG.API_ENDPOINT){
    const r=await fetch(CONFIG.API_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image:dataURL})});
    if(!r.ok) throw new Error("分析失败");
    return r.json();
  }
  return mockAnalyze(dataURL);
}

/* ================= 雷达图 ================= */
function drawRadar(ctx,cx,cy,R,vals,col,font){
  const n=vals.length;ctx.save();
  for(let k=4;k>=1;k--){ctx.beginPath();for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n,r=R*k/4;ctx[i?"lineTo":"moveTo"](cx+r*Math.cos(a),cy+r*Math.sin(a))}
    ctx.closePath();ctx.fillStyle=k%2?"#FFF4EC":"#FFFFFF";ctx.fill();ctx.strokeStyle="#F0DCD0";ctx.lineWidth=1.5;ctx.stroke()}
  ctx.beginPath();vals.forEach((v,i)=>{const a=-Math.PI/2+i*2*Math.PI/n,r=R*v/100;ctx[i?"lineTo":"moveTo"](cx+r*Math.cos(a),cy+r*Math.sin(a))});
  ctx.closePath();ctx.fillStyle=col+"66";ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=3;ctx.stroke();
  ctx.fillStyle="#5A4A46";ctx.font=font;ctx.textAlign="center";ctx.textBaseline="middle";
  vals.forEach((v,i)=>{const a=-Math.PI/2+i*2*Math.PI/n,r=R+parseInt(font)*1.6;ctx.fillText(DIMS[i]+" "+v,cx+r*Math.cos(a),cy+r*Math.sin(a))});
  ctx.restore();
}

  $("aAspects").innerHTML=res.aspects.map(a=>`<div class="asp${a.name===res.best?" best":""}">
    <div class="asp-top"><span class="ic">${a.icon}</span><span class="nm">${a.name}</span><span class="lb">${a.label}</span></div>
    <div class="asp-bar"><div class="tr"><i data-w="${a.score}"></i></div><b>${a.score}</b></div>
    <p>${a.text}</p></div>`).join("");
  $("aSum").textContent=res.summary;

  $("rPhoto").src=photoURL;
  $("rWho").textContent=(nick?nick+" 的":"你的")+"气质人设";
  $("rSeries").textContent=res.emoji+" "+res.series;
  $("rName").textContent=res.name;
  $("rTags").innerHTML=res.tags.map(t=>`<span style="background:${res.colors[0]}22;color:${res.colors[0]}">#${t}</span>`).join("");
  $("rQuote").textContent="“"+res.quote+"”";
  $("rScore").textContent=res.rarity;$("rScore").style.color=res.colors[0];
  $("rBeat").textContent=res.match_rate;$("rBeat").style.color=res.colors[0];
  $("rTips").innerHTML=Object.entries(res.tips).map(([k,v])=>`<div class="tip"><em>${k}</em><span>${v}</span></div>`).join("");
  $("rMatch").textContent=res.match;
  const ctx=$("radar").getContext("2d");ctx.clearRect(0,0,520,460);drawRadar(ctx,260,235,150,res.dims,res.colors[0],"bold 24px sans-serif");
  show("s-result");
}

/* ================= 分享图（1080×1920） ================= */
function wrap(ctx,text,x,y,maxW,lh,maxLines){
  let line="",lines=[];for(const ch of text){if(ctx.measureText(line+ch).width>maxW){lines.push(line);line=ch}else line+=ch}
  lines.push(line);lines=lines.slice(0,maxLines);lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lh));return lines.length*lh;
}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function makeShare(){
  return new Promise(ok=>{
    const r=result,W=1080,H=1920,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
    const F='"PingFang SC","Microsoft YaHei",sans-serif';
    let g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,"#FFF6EC");g.addColorStop(1,"#FDE7E4");x.fillStyle=g;x.fillRect(0,0,W,H);
    // 卡片
    x.save();x.shadowColor="rgba(180,110,90,.22)";x.shadowBlur=50;x.shadowOffsetY=16;rr(x,70,90,940,1600,56);x.fillStyle="#fff";x.fill();x.restore();
    x.save();rr(x,70,90,940,1600,56);x.clip();
    g=x.createLinearGradient(70,90,1010,640);g.addColorStop(0,r.colors[0]);g.addColorStop(1,r.colors[1]);x.fillStyle=g;x.fillRect(70,90,940,600);x.restore();
    const img=new Image();img.onload=()=>{
      // 头像
      const cx=540,cy=300,R=150;x.save();x.beginPath();x.arc(cx,cy,R+10,0,7);x.fillStyle="rgba(255,255,255,.85)";x.fill();
      x.beginPath();x.arc(cx,cy,R,0,7);x.clip();const s=Math.max(2*R/img.width,2*R/img.height);
      x.drawImage(img,cx-img.width*s/2,cy-img.height*s/2,img.width*s,img.height*s);x.restore();
      x.textAlign="center";x.fillStyle="#fff";
      const nick=$("nick").value.trim();
      x.font=`32px ${F}`;x.globalAlpha=.9;x.fillText((nick?nick+" 的":"我的")+"气质人设",540,520);x.globalAlpha=1;
      x.font=`bold 30px ${F}`;const st=r.emoji+" "+r.series,sw=x.measureText(st).width+50;
      rr(x,540-sw/2,548,sw,52,26);x.fillStyle="rgba(255,255,255,.28)";x.fill();x.fillStyle="#fff";x.fillText(st,540,585);
      x.font=`900 84px ${F}`;x.fillText(r.name,540,680);
      // 标签
      x.font=`bold 32px ${F}`;let tw=r.tags.map(t=>x.measureText("#"+t).width+48),tot=tw.reduce((a,b)=>a+b,0)+20*(tw.length-1),tx=540-tot/2;
      r.tags.forEach((t,i)=>{rr(x,tx,740,tw[i],60,30);x.fillStyle=r.colors[0]+"22";x.fill();x.fillStyle=r.colors[0];x.fillText("#"+t,tx+tw[i]/2,781);tx+=tw[i]+20});
      // 文案
      rr(x,130,840,820,250,30);x.fillStyle="#FFF8F2";x.fill();
      x.fillStyle="#5A4A46";x.font=`34px ${F}`;x.textAlign="left";wrap(x,"“"+r.quote+"”",170,905,740,56,4);
      // 分数
      x.textAlign="left";x.fillStyle=r.colors[0];x.font=`900 120px ${F}`;x.fillText(r.beauty,150,1250);
      const nw=x.measureText(r.beauty+"").width;x.font=`bold 40px ${F}`;x.fillText("分",160+nw,1250);
      x.fillStyle="#8A7B76";x.font=`28px ${F}`;x.fillText("颜值综合分",150,1140);
      x.textAlign="right";x.fillStyle="#8A7B76";x.font=`30px ${F}`;x.fillText("最出彩 · "+r.best,930,1190);
      x.fillStyle=r.colors[0];x.font=`bold 40px ${F}`;x.fillText("人设稀有度 "+r.rarity,930,1245);
      // 雷达
      drawRadar(x,540,1470,165,r.dims,r.colors[0],`bold 30px ${F}`);
      // 底部
      x.textAlign="center";x.fillStyle="#3B2F2F";x.font=`bold 40px ${F}`;x.fillText("你是哪种气质？来测测 →",540,1790);
      x.fillStyle="#8A7B76";x.font=`28px ${F}`;x.fillText(location.host?location.host+location.pathname:"AI气质人设卡",540,1845);
      ok(c.toDataURL("image/png"));
    };img.src=photoURL;
  });
}
